[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "automl_estimators"
dynamic = ["version"]
requires-python = "<3.12"
authors = [
    {name = "Pedro Ribeiro"},
]
license = {text = "MIT License"}
description = "Estimator Wrappers for Model Selection/Hyperparameter Optimization Tools"
readme = "README.md"
keywords = ["pipeline optimization", "hyperparameter optimization", "data science", "machine learning"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy==1.26.4",
    "scipy>=1.3.1",
    "scikit-learn>=1.3.0",
    "update_checker>=0.16",
    "joblib>=1.1.1",
    "xgboost>=1.7.0",
    "optuna>=3.0.5",
    "configspace>=0.7.1",
]

[tool.setuptools.dynamic]
version = {attr = "automl_estimators._version.__version__"}

[tool.setuptools.packages.find]
include = ["automl_estimators*"]
